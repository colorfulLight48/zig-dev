name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Define the matrix matching the host runner to the correct target platform
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64

    # Dynamically select the free native host runner based on the matrix item
    runs-on: ${{ matrix.runner }}
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          # Build only the native platform for this specific runner (No QEMU needed!)
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/colorfullight48/zig-dev:latest-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}
            ghcr.io/colorfullight48/zig-dev:${{ github.sha }}-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
